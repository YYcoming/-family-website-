<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">湖边晚霞</title>
  <desc id="desc">橘粉色的晚霞倒映在平静的湖面上</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7e8e97"/>
      <stop offset=".4" stop-color="#d89980"/>
      <stop offset=".75" stop-color="#efb277"/>
      <stop offset="1" stop-color="#f4cf9d"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bea28f"/>
      <stop offset="1" stop-color="#566b70"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffe0a2" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f2b56d" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="grain">
