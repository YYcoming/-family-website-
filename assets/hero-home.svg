<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" aria-labelledby="title desc">
  <title id="title">温暖的小院</title>
  <desc id="desc">傍晚的太阳照在一栋小房子和花园上</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e5cf"/>
      <stop offset=".65" stop-color="#ead9bc"/>
      <stop offset="1" stop-color="#d6c59f"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#f4d69a" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#eabf77" stop-opacity=".65"/>
      <stop offset="1" stop-color="#eabf77" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#869479"/>
      <stop offset="1" stop-color="#596b5a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7edd6"/>
      <stop offset="1" stop-color="#dfcda8"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .055"/>
      </feComponentTransfer>
    </filter>
  </defs>
